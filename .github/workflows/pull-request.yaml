name: CI

on:
  pull_request: {}

# Ensure only one check can run at a time for a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: Check Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed for buf breaking check to work

      - name: Create .npmrc
        run: |
          echo "@cirruscrmio:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checking
        run: bun run --filter '*' typecheck

      - name: Run linting
        run: bun run --filter '*' lint

      - name: Run tests
        run: bun run --filter '*' test

      - name: Check Proto schema for breaking changes
        run: bunx buf breaking --against '../../.git#branch=origin/${{ github.base_ref }},subdir=packages/cirrus-service-template-api-proto/'
        working-directory: packages/cirrus-service-template-api-proto
