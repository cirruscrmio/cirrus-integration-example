# This file contains all GraphQL queries needed by the application.
# Find the full available schema at
# https://docs.cirruscrm.io/docs/graphql/schema/

query whoAmI {
  viewer {
    fullName
  }
}

query articles($cursor: String) {
  articles(after: $cursor) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Article
      }
    }
  }
}

query findArticle($cursor: String, $articleNumber: String!) {
  articles(after: $cursor, filter: { fulltext: $articleNumber }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Article
      }
    }
  }
}

fragment Article on Article {
  id
  number

  description
  buyprice
  price
  name
  active
  externalKey
  vat
}

query findAccounts($cursor: String, $accountNumber: String!) {
  accounts(after: $cursor, filter: { fullText: $accountNumber }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Account
      }
    }
  }
}

# Looks up accounts by their externalKey. Since the externalKey is unique per
# external system record, this is what we use to check if an account has
# already been synced into Cirrus.
query findAccountByExternalKey($cursor: String, $externalKey: String!) {
  accounts(after: $cursor, filter: { externalKey: $externalKey }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Account
      }
    }
  }
}

fragment Account on Account {
  id
  number
  name
  externalKey
  userId
}

query findContacts($cursor: String, $accountId: Int!) {
  contacts(after: $cursor, filter: { active: 1, accountId: $accountId }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Contact
      }
    }
  }
}

fragment Contact on Contact {
  id
  name
  surname
  title
  active
  externalKey
}

query findAccountUser($accountId: Int) {
  account(id: $accountId) {
    userId
    user {
      id
    }
  }
}

query getOrders($cursor: String, $externalKey: String!) {
  orders(after: $cursor, filter: { externalKey: $externalKey }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        ...Order
      }
    }
  }
}

fragment OrderRow on OrderRow {
  id
  article {
    id
  }
  articleUnit {
    id
    name
  }
  quantity {
    delivered
  }
  price
  discountPercent
  discountAmount
  sortOrder
  specification
  deleted
}

fragment Order on Order {
  id
  placeDate {
    iso
  }
  externalKey
  alternateId
  account {
    id
  }
  contact {
    id
  }
  rows {
    ...OrderRow
  }
  paymentTerm {
    id
    name
  }
  delivery {
    term {
      id
      name
    }
    type {
      id
    }
  }
  status {
    id
    name
  }
  type {
    id
  }
  user {
    id
  }
}

query findPaymentTerm($cursor: String, $name: String!) {
  paymentTerms(after: $cursor, filter: { name: $name }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        id
        name
      }
    }
  }
}

