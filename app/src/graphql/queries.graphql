query findAnyArticleGroup {
  articleGroups(filter: { sort: ID_ASC }) {
    edges {
      node {
        id
      }
    }
  }
}

query findOrderDefaults {
  deliveryTypes(filter: { default: 1 }) {
    edges {
      node {
        id
      }
    }
  }

  deliveryTerms(filter: { default: 1 }) {
    edges {
      node {
        id
      }
    }
  }

  paymentTerms(filter: { default: 1 }) {
    edges {
      node {
        id
      }
    }
  }

  orderTypes(filter: { default: 1 }) {
    edges {
      node {
        id
      }
    }
  }

  orderStatuses {
    edges {
      node {
        id
      }
    }
  }
}
